spring.application.name=parque-api
server.port=8080

# Banco padrão: H2 em arquivo (./data/parque), sem precisar instalar nada.
# Para PostgreSQL, rode com o perfil "postgres" (veja o README).
spring.datasource.url=jdbc:h2:file:./data/parque
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.jackson.time-zone=America/Sao_Paulo

# JWT. TROQUE o segredo em produção (defina a variável JWT_SECRET, com 32+ caracteres).
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-0123456789}
app.jwt.expiracao-horas=168
